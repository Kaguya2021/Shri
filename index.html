<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold Italic Text Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
            margin-bottom: 16px;
        }
        .output-box {
            background: #000;
            border: 1px solid #282828;
            border-radius: 10px;
            padding: 16px;
            min-height: 80px;
            font-size: 24px;
            word-break: break-word;
            margin-bottom: 16px;
            text-align: center;
        }
        .copy-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .toast {
            text-align: center;
            color: #4cd964;
            font-size: 13px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="card">
    <textarea id="userInput" placeholder="Введите текст на любом языке..."></textarea>
    <div class="output-box" id="outputText">𝑩𝒐𝒍𝒅 𝑰𝒕𝒂𝒍𝒊𝒄</div>
    <button class="copy-btn" id="copyBtn">Скопировать текст</button>
    <div class="toast" id="toast">Скопировано!</div>
</div>

<script>
    const userInput = document.getElementById('userInput');
    const outputText = document.getElementById('outputText');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');

    const unicodeMap = {
        // EN
        'A': '𝑨', 'B': '𝑩', 'C': '𝑪', 'D': '𝑫', 'E': '𝑬', 'F': '𝑭', 'G': '𝑮',
        'H': '𝑯', 'I': '𝑰', 'J': '𝑱', 'K': '𝑩', 'L': '𝑳', 'M': '𝑴', 'N': '𝑵',
        'O': '𝑶', 'P': '𝑸', 'Q': '𝑸', 'R': '𝑹', 'S': '𝑺', 'T': '𝑻', 'U': '𝑼',
        'V': '𝑽', 'W': '𝑾', 'X': '𝑿', 'Y': '𝒀', 'Z': '𝒁',
        'a': '𝒂', 'b': '𝒃', 'c': '𝒄', 'd': '𝒅', 'e': '𝒆', 'f': '𝒇', 'g': '𝒈',
        'h': '𝒉', 'i': '𝒊', 'j': '𝒋', 'k': '𝒌', 'l': '𝒍', 'm': '𝒎', 'n': '𝒏',
        'o': '𝒐', 'p': '𝒑', 'q': '𝒒', 'r': '𝒓', 's': '𝒔', 't': '𝒕', 'u': '𝒖',
        'v': '𝒗', 'w': '𝒘', 'x': '𝒙', 'y': '𝒚', 'z': '𝒛',
        // RU (Псевдо-замена)
        'А': '𝑨', 'Б': '𝟔', 'В': '𝑩', 'Г': '𝑻', 'Д': '𝑫', 'Е': '𝑬', 'Ё': '𝑬',
        'Ж': '𝑾', 'З': '𝒁', 'И': '𝑼', 'Й': '𝑼', 'К': '𝑩', 'Л': '𝑳', 'М': '𝑴',
        'Н': '𝑯', 'О': '𝑶', 'П': '𝑷', 'Р': '𝑸', 'С': '𝑪', 'Т': '𝑻', 'У': '𝒀',
        'Ф': '𝜱', 'Х': '𝑿', 'Ц': '𝑼', 'Ч': '𝒀', 'Ш': '𝑾', 'Щ': '𝑾',
        'а': '𝒂', 'б': '𝜯', 'в': '𝜝', 'г': '𝜸', 'д': '𝒅', 'е': '𝒆', 'ё': '𝒆',
        'ж': '𝒘', 'з': '𝒛', 'и': '𝒖', 'й': '𝒖', 'к': '𝒌', 'л': '𝒍', 'м': '𝒎',
        'н': '𝒉', 'о': '𝒐', 'п': '𝒑', 'р': '𝒑', 'с': '𝒄', 'т': '𝒎', 'у': '𝒚',
        'ф': '𝜙', 'х': '𝒙', 'ц': '𝒖', 'ч': '𝒛', 'ш': '𝒘', 'щ': '𝒘',
        '0': '𝟎', '1': '𝟏', '2': '𝟐', '3': '𝟑', '4': '𝟒', '5': '𝟓', '6': '𝟔', '7': '𝟕', '8': '𝟖', '9': '𝟡'
    };

    function convertText(str) {
        return str.split('').map(char => unicodeMap[char] || char).join('');
    }

    userInput.addEventListener('input', () => {
        const val = userInput.value;
        outputText.textContent = val ? convertText(val) : '𝑩𝒐𝒍𝒅 𝑰𝒕𝒂𝒍𝒊𝒄';
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(outputText.textContent).then(() => {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        });
    });
</script>

</body>
</html>
