<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bold Italic Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 20px;
            margin-bottom: 16px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
            margin-bottom: 16px;
        }
        textarea:focus { border-color: #555; }
        .mode-badge {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .output-box {
            background: #000;
            border: 1px solid #282828;
            border-radius: 10px;
            padding: 16px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .text-output {
            font-size: 24px;
            word-break: break-word;
            text-align: center;
            width: 100%;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: none;
        }
        .copy-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
        }
        .copy-btn:hover { background: #e0e0e0; }
        .copy-btn:active { transform: scale(0.98); }
        .toast {
            text-align: center;
            color: #4cd964;
            font-size: 13px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="card">
    <h1>Bold Italic Generator</h1>
    
    <textarea id="userInput" placeholder="Введите текст (Русский или English)..."></textarea>

    <div class="mode-badge" id="modeBadge">Режим: Unicode Текст</div>
    
    <div class="output-box">
        <!-- Блок для английского текста (Unicode) -->
        <div class="text-output" id="textOutput">𝑩𝒐𝒍𝒅 𝑰𝒕𝒂𝒍𝒊𝒄</div>
        <!-- Блок для русского текста (Картинка) -->
        <canvas id="imageOutput"></canvas>
    </div>

    <button class="copy-btn" id="copyBtn">Скопировать</button>
    <div class="toast" id="toast">Скопировано!</div>
</div>

<script>
    const userInput = document.getElementById('userInput');
    const textOutput = document.getElementById('textOutput');
    const imageOutput = document.getElementById('imageOutput');
    const modeBadge = document.getElementById('modeBadge');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');
    const ctx = imageOutput.getContext('2d');

    // Карта символов Unicode Bold Italic (A-Z, a-z, 0-9)
    const boldItalicMap = {
        'A': '𝑨', 'B': '𝑩', 'C': '𝑪', 'D': '𝑫', 'E': '𝑬', 'F': '𝑭', 'G': '𝑮',
        'H': '𝑯', 'I': '𝑰', 'J': '𝑱', 'K': '𝑩', 'L': '𝑳', 'M': '𝑴', 'N': '𝑵',
        'O': '𝑶', 'P': '𝑸', 'Q': '𝑸', 'R': '𝑹', 'S': '𝑺', 'T': '𝑻', 'U': '𝑼',
        'V': '𝑽', 'W': '𝑾', 'X': '𝑿', 'Y': '𝒀', 'Z': '𝒁',
        'a': '𝒂', 'b': '𝒃', 'c': '𝒄', 'd': '𝒅', 'e': '𝒆', 'f': '𝒇', 'g': '𝒈',
        'h': '𝒉', 'i': '𝒊', 'j': '𝒋', 'k': '𝒌', 'l': '𝒍', 'm': '𝒎', 'n': '𝒏',
        'o': '𝒐', 'p': '𝒑', 'q': '𝒒', 'r': '𝒓', 's': '𝒔', 't': '𝒕', 'u': '𝒖',
        'v': '𝒗', 'w': '𝒘', 'x': '𝒙', 'y': '𝒚', 'z': '𝒛',
        '0': '𝟎', '1': '𝟏', '2': '𝟐', '3': '𝟑', '4': '𝟒', '5': '𝟓', '6': '𝟔', '7': '𝟕', '8': '𝟖', '9': '𝟡'
    };

    let currentMode = 'unicode'; // 'unicode' или 'image'

    // Проверка: содержит ли текст кириллицу или другие не-латинские символы
    function hasNonLatin(str) {
        return /[а-яА-ЯёЁ]/.test(str);
    }

    function convertToUnicode(str) {
        return str.split('').map(char => boldItalicMap[char] || char).join('');
    }

    function renderImage(text) {
        const fontStyle = 'bold italic 36px "Georgia", serif';
        ctx.font = fontStyle;
        
        const metrics = ctx.measureText(text || 'Пример');
        imageOutput.width = metrics.width + 40;
        imageOutput.height = 70;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, imageOutput.width, imageOutput.height);

        ctx.font = fontStyle;
        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'middle';
        ctx.fillText(text || 'Пример', 20, imageOutput.height / 2);
    }

    function updateView() {
        const val = userInput.value;

        if (hasNonLatin(val)) {
            // Включить режим картинки для русского
            currentMode = 'image';
            modeBadge.textContent = 'Режим: Картинка (для русского)';
            textOutput.style.display = 'none';
            imageOutput.style.display = 'block';
            renderImage(val);
        } else {
            // Включить режим текста Unicode для латиницы
            currentMode = 'unicode';
            modeBadge.textContent = 'Режим: Unicode Текст (копируется как текст)';
            imageOutput.style.display = 'none';
            textOutput.style.display = 'block';
            textOutput.textContent = val ? convertToUnicode(val) : '𝑩𝒐𝒍𝒅 𝑰𝒕𝒂𝒍𝒊𝒄';
        }
    }

    userInput.addEventListener('input', updateView);

    copyBtn.addEventListener('click', () => {
        if (currentMode === 'unicode') {
            // Копируем как текст
            const textToCopy = textOutput.textContent;
            navigator.clipboard.writeText(textToCopy).then(showToast);
        } else {
            // Копируем как PNG-картинку
            imageOutput.toBlob(blob => {
                if (!blob) return;
                const item = new ClipboardItem({ 'image/png': blob });
                navigator.clipboard.write([item]).then(showToast);
            });
        }
    });

    function showToast() {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
</script>

</body>
</html>
